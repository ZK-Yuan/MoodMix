services:
  - type: web
    name: moodmix-frontend
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server/prodServer.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: VOLCENGINE_API_KEY
        sync: false
      - key: VOLCENGINE_ENDPOINT
        sync: false
      - key: VOLCENGINE_API_URL
        value: https://ark.cn-beijing.volces.com/api/v3/chat/completions
      - key: PORT
        value: 10000
